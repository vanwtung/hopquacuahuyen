<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hộp Quà Tương Tác Premium - Sửa Lỗi</title>
    <style>
        :root {
            --box-color: #ff3366;
            --box-dark: #e6003e;
            --ribbon-color: #ffcc00;
            --ribbon-dark: #cca300;
            --glow-color: rgba(255, 51, 102, 0.4);
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Khung chứa tổng thể */
        .gift-container {
            position: relative;
            text-align: center;
            margin-bottom: 40px;
            z-index: 10;
        }

        /* VÙNG CLICK CHUẨN XÁC */
        .gift-click-zone {
            position: relative;
            width: 160px;
            height: 170px;
            margin: 0 auto;
            cursor: pointer;
            user-select: none;
        }

        /* --- NƠ RUY BĂNG 3D --- */
        .gift-bow {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 35px;
            z-index: 15;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
            pointer-events: none;
        }
        .gift-bow::before, .gift-bow::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            background: var(--ribbon-color);
            border-radius: 50% 50% 0 50%;
            box-shadow: inset -4px -4px 8px var(--ribbon-dark);
        }
        .gift-bow::before { transform: rotate(45deg); left: 3px; }
        .gift-bow::after { transform: rotate(-45deg) scaleX(-1); right: 3px; }

        /* --- NẮP HỘP QUÀ --- */
        .gift-lid {
            width: 160px;
            height: 38px;
            background: linear-gradient(135deg, var(--box-color), var(--box-dark));
            position: absolute;
            top: 32px;
            left: 0;
            border-radius: 8px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            z-index: 12;
            transform-origin: bottom right; 
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        /* --- THÂN HỘP QUÀ --- */
        .gift-box {
            width: 140px;
            height: 125px;
            background: linear-gradient(135deg, var(--box-color), var(--box-dark));
            position: absolute;
            bottom: 0;
            left: 10px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 20px 40px var(--glow-color), 0 10px 20px rgba(0,0,0,0.4);
            pointer-events: none;
            transition: transform 0.3s;
        }

        .gift-click-zone:hover .gift-box { transform: scale(1.03); }
        .gift-click-zone:hover .gift-lid { transform: translateY(-2px); }

        .ribbon-vertical {
            width: 28px;
            height: 100%;
            background: linear-gradient(to right, #ffe600, var(--ribbon-color), var(--ribbon-dark));
            margin: 0 auto;
        }
        .ribbon-horizontal {
            width: 100%;
            height: 28px;
            background: linear-gradient(to bottom, #ffe600, var(--ribbon-color), var(--ribbon-dark));
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
        }

        /* TRẠNG THÁI MỞ HỘP */
        .gift-container.open .gift-bow {
            transform: translate(40px, -120px) rotate(60deg) scale(0);
            opacity: 0;
        }
        .gift-container.open .gift-lid {
            transform: translate(90px, -70px) rotate(115deg);
            opacity: 0.9;
        }

        /* --- HÀNG NGANG CHỨA ẢNH (SỬA LỖI ĐỊNH VỊ) --- */
        .image-gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            width: 90%;
            max-width: 1100px;
            height: 150px; /* Khóa cứng chiều cao để tính tọa độ chuẩn */
            margin-top: 20px;
            position: relative;
        }

        /* Thẻ bao bọc ảnh/nội dung */
        .gallery-item {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border: 4px solid #ffffff;
            cursor: pointer;
            position: absolute; /* Bắt buộc để bay từ hộp quà */
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            overflow: hidden;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Thẻ chứa emoji hoặc chữ thay thế nếu ảnh lỗi */
        .gallery-item .fallback-text {
            font-size: 50px;
            user-select: none;
        }

        /* Kích hoạt hiển thị */
        .gallery-item.show {
            position: relative; /* Trả về relative để flexbox xếp hàng */
            top: auto; left: auto;
            transform: translate(0, 0) scale(1);
            opacity: 1;
            animation: flyToLine 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .gallery-item.show:hover {
            transform: scale(1.2) translateY(-15px) rotate(3deg) !important;
            box-shadow: 0 25px 45px rgba(255, 51, 102, 0.4);
            border-color: var(--box-color);
            z-index: 20;
        }

        /* Phóng to ảnh */
        .gallery-item.fullscreen {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(3.5) !important;
            z-index: 100;
            box-shadow: 0 0 60px rgba(0,0,0,0.7);
            border-color: #ffffff;
        }

        /* Hạt lấp lánh pháo hoa */
        .sparkle {
            position: absolute;
            width: 8px; height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9;
            animation: explodeSparkle 0.8s ease-out forwards;
        }

        @keyframes flyToLine {
            0% { transform: translate(var(--startX), var(--startY)) scale(0.1) rotate(0deg); opacity: 0; }
            40% { transform: translate(var(--midX), var(--midY)) scale(1.4) rotate(var(--r)); opacity: 1; }
            100% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes explodeSparkle {
            0% { transform: translate(var(--bx), var(--by)) scale(1); opacity: 1; }
            100% { transform: translate(calc(var(--bx) + var(--sx)), calc(var(--by) + var(--sy))) scale(0); opacity: 0; }
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 15, 0.85);
            backdrop-filter: blur(8px);
            z-index: 90;
            display: none;
        }
        .overlay.active { display: block; }

        p.instruction {
            color: #94a3b8;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 25px;
            user-select: none;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="overlay" id="blurOverlay"></div>

    <div class="gift-container" id="gift">
        <div class="gift-click-zone" id="clickZone">
            <div class="gift-bow"></div>
            <div class="gift-lid"><div class="ribbon-vertical"></div></div>
            <div class="gift-box">
                <div class="ribbon-vertical"></div>
                <div class="ribbon-horizontal"></div>
            </div>
        </div>
        <p class="instruction">✨ Chạm vào hộp để nhận điều kỳ diệu ✨</p>
    </div>

    <div class="image-gallery" id="gallery"></div>

        function makeItem(data) {
        const el = document.createElement('div');
            el.className = 'gallery-item show';
            el.style.animation = 'none'; // tạm tắt để đo vị trí cuối

        const showFallback = () => {
            el.innerHTML = `<span class="fallback-text">${data.fallback}</span>`;
        };
        const img = new Image();
            img.src = data.src;
            img.onerror = showFallback;
            el.appendChild(img);
            return el;
        }

    clickZone.addEventListener('click', () => {
        if (giftContainer.classList.contains('open')) return;
    giftContainer.classList.add('open');

        const zone = clickZone.getBoundingClientRect();
        const originX = zone.left + zone.width / 2;
        const originY = zone.top + zone.height / 2;

  // 1. Hạt lấp lánh
        const colors = ['#ffcc00', '#ff3366', '#ffffff', '#38bdf8'];
            for (let i = 0; i < 40; i++) {
        const s = document.createElement('div');
            s.className = 'sparkle';
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 120;
            s.style.left = '50%';
    s.style.top = '40%';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--bx', '0px');
    s.style.setProperty('--by', '0px');
    s.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    clickZone.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }

  // 2. Đặt TẤT CẢ ảnh vào hàng trước, rồi mới đo
  const items = itemsData.map(makeItem);
  items.forEach(el => gallery.appendChild(el));

  items.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const dx = originX - (r.left + r.width / 2);
    const dy = originY - (r.top + r.height / 2);
    el.style.setProperty('--startX', dx + 'px');
    el.style.setProperty('--startY', dy + 'px');
    el.style.setProperty('--midX', dx * 0.5 + 'px');
    el.style.setProperty('--midY', dy * 0.5 - 80 + 'px');
    el.style.setProperty('--r', (Math.random() * 40 - 20) + 'deg');
    el.style.animationDelay = i * 0.15 + 's';
  });

  void gallery.offsetWidth;                       // ép trình duyệt tính lại layout
  items.forEach(el => (el.style.animation = '')); // bật animation

  items.forEach(el => el.addEventListener('click', () => openItem(el)));
});

// 3. Phóng to / thu nhỏ
let activeItem = null, placeholder = null;

function openItem(el) {
  if (activeItem) return;
  activeItem = el;
  placeholder = document.createElement('div');
  placeholder.className = 'gallery-placeholder';
  gallery.insertBefore(placeholder, el);
  el.classList.add('fullscreen');
  overlay.classList.add('active');
}

function closeItem() {
  if (!activeItem) return;
  activeItem.classList.remove('fullscreen');
  placeholder.remove();
  overlay.classList.remove('active');
  activeItem = placeholder = null;
}

overlay.addEventListener('click', closeItem);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeItem(); });
